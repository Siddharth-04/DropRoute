spring:
  application:
    name: backend
  datasource:
    url: jdbc:postgresql://localhost:5432/droproute
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
logging:
  level:
    org.flywaydb: INFO
jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000
